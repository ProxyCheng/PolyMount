name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build, test, smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      # Not a runtime nicety: PolyMount.Core compiles against Fsp.* from winfsp-msil.dll, which the
      # projects reference at its installed path. Without it nothing builds at all.
      - name: Install WinFsp
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp.msi'
          if (-not (Test-Path -LiteralPath $msi)) {
            curl.exe --ssl-revoke-best-effort -fL --retry 3 -o $msi `
              https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi
          }
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru
          Write-Host "WinFsp installer exit code: $($p.ExitCode)"
          if (-not (Test-Path -LiteralPath "${env:ProgramFiles(x86)}\WinFsp\bin\winfsp-msil.dll")) {
            throw 'WinFsp did not install winfsp-msil.dll'
          }

      # QtSharp.Api and QtSharp.Charts are not on nuget.org; the qtsharp source is a local folder.
      - name: Fetch QtSharp packages
        shell: pwsh
        run: ./scripts/Fetch-QtSharp.ps1

      - name: Build
        run: dotnet build PolyMount.slnx -c Release --nologo

      - name: Unit tests
        run: dotnet test PolyMount.slnx -c Release --no-build --nologo

      # The plugin tests are their own runner, not a test-SDK project, so dotnet test never sees
      # them. It enumerates PolyMount.Plugin.*.Tests.dll in the directory it is given -- which is
      # the test project's own build output, where the plugin under test sits beside it. The
      # network case skips itself unless svn.repository is passed.
      - name: Plugin tests
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem tests/plugins/*/*.Tests.csproj | ForEach-Object {
            $out = Join-Path $_.DirectoryName 'bin/Release/net10.0-windows'
            Write-Host "Plugin tests from $out"
            dotnet run --project tests/PolyMount.Plugin.Tests -c Release --no-build -- $out
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      # All three are self-contained: their own configuration, their own store, a dir source and
      # a mount point under %TEMP%. What they need from the runner is the built service and WinFsp.
      - name: Smoke - one instance, its own pipe
        shell: pwsh
        run: ./scripts/Test-InstanceWorker.ps1 -ServiceExecutable src/PolyMount.Service/bin/Release/net10.0-windows/PolyMount.Service.exe

      - name: Smoke - copy-up, delete, rename, persistence
        shell: pwsh
        run: ./scripts/Test-ObjectMount.ps1 -ServiceExecutable src/PolyMount.Service/bin/Release/net10.0-windows/PolyMount.Service.exe

      # The MCP server is what an agent talks to, so the wire is what is proved: handshake, tool
      # list, real calls through a supervisor of the test's own, and the error a client sees when
      # the service is gone. -Full adds one real enable -> mount -> disable round trip.
      - name: Smoke - MCP server over stdio
        shell: pwsh
        run: |
          ./scripts/Test-Mcp.ps1 `
            -ServiceExecutable src/PolyMount.Service/bin/Release/net10.0-windows/PolyMount.Service.exe `
            -McpExecutable src/PolyMount.Mcp/bin/Release/net10.0-windows/PolyMount.Mcp.exe `
            -Full

  package:
    name: Package installer
    runs-on: windows-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install WinFsp
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp.msi'
          curl.exe --ssl-revoke-best-effort -fL --retry 3 -o $msi `
            https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru
          Write-Host "WinFsp installer exit code: $($p.ExitCode)"

      - name: Fetch QtSharp packages
        shell: pwsh
        run: ./scripts/Fetch-QtSharp.ps1

      # Signing is optional: without the secret the build is the same as before. The certificate
      # travels as a base64 PFX so the workflow never needs a hardware token; an EV token cannot
      # be used from a hosted runner, which is why those use a cloud signing service instead.
      # The test is in the script, not in `if:`: the secrets context is not available to a step
      # conditional.
      - name: Prepare signing certificate
        shell: pwsh
        env:
          SIGNING_PFX_B64: ${{ secrets.SIGNING_PFX_B64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:SIGNING_PFX_B64) {
            Write-Host 'No signing certificate is configured; the setup will be unsigned.'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_B64))
          $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          # The build verifies the setup it signed. A self-signed certificate verifies only where
          # it is trusted, and every hosted runner is a fresh machine.
          $cer = Join-Path $env:RUNNER_TEMP 'signing.cer'
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          certutil -addstore -f Root $cer | Out-Null
          certutil -addstore -f TrustedPublisher $cer | Out-Null
          "POLYMOUNT_SIGN_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Shipped beside the setup: a self-signed signature is verifiable only where this
          # certificate is trusted, and whoever installs the package needs the certificate.
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item $cer artifacts/PolyMount-Signing.cer -Force

      - name: Build installer
        shell: pwsh
        run: |
          # A tag names the version; otherwise a build number keeps it valid and increasing.
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $version = "0.0.0.$($env:GITHUB_RUN_NUMBER)"
          }
          Write-Host "Installer version: $version"
          ./scripts/Build-Installer.ps1 -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: PolyMount-Setup
          path: |
            artifacts/PolyMount-*-Setup.exe
            artifacts/PolyMount-*-Setup.exe.sha256
            artifacts/PolyMount-Signing.cer
          if-no-files-found: error

  # The one check that uses the product the way a reader does: a machine that has never seen it,
  # the real setup, and what is left behind. WinFsp is deliberately not installed beforehand so
  # the setup's own dependency step is exercised too.
  install-test:
    name: Install and verify
    runs-on: windows-latest
    needs: package
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: PolyMount-Setup
          path: artifacts

      - name: Install, install over the top, uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem artifacts/PolyMount-*-Setup.exe | Select-Object -First 1
          Write-Host "Testing $($setup.Name)"
          ./scripts/Test-Installed.ps1 -Setup $setup.FullName

  # A tag is the only thing that publishes a release. Branch builds upload the setup as an
  # artifact, which takes a GitHub login to download and disappears with the run; the tray's
  # update check reads releases/latest, so a release is what makes a build something a reader
  # can install. The install test runs first: a setup that cannot install is never published.
  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: install-test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      # gh reads the repository context from the working tree; without a checkout it fails with
      # "fatal: not a git repository" before it ever calls the API.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: PolyMount-Setup
          path: artifacts

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(artifacts/PolyMount-*-Setup.exe artifacts/PolyMount-*-Setup.exe.sha256)
          if [ -f artifacts/PolyMount-Signing.cer ]; then assets+=(artifacts/PolyMount-Signing.cer); fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --title "$GITHUB_REF_NAME" --generate-notes
